name: Analyzer Tests

on:
  push:
    paths:
      - 'DoaneDevTools.Analyzers/**'
      - 'DoaneDevTools.Analyzers.Tests/**'
  pull_request:
    paths:
      - 'DoaneDevTools.Analyzers/**'

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DoaneDevTools.Analyzers/DoaneDevTools.Analyzers.csproj

      - name: Build analyzers
        run: dotnet build DoaneDevTools.Analyzers/DoaneDevTools.Analyzers.csproj --configuration Release --no-restore

      - name: Run tests
        if: hashFiles('DoaneDevTools.Analyzers.Tests/**/*.csproj') != ''
        run: dotnet test --configuration Release --logger "trx;LogFileName=results.trx" --results-directory ./test-results

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          if-no-files-found: ignore
