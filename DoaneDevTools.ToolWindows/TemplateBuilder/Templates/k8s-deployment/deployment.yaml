apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ service-name }}
  namespace: prod
  labels:
    app: {{ service-name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ service-name }}
  template:
    metadata:
      labels:
        app: {{ service-name }}
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: {{ service-name }}
          image: doaneu/{{ service-name }}:latest
          ports:
            - containerPort: {{ port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ service-name }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: {{ port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
